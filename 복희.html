<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여와와 복희의 소리 창조</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        header {
            text-align: center;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #d4af37;
            border-bottom: 1px solid #333;
            width: 100%;
        }
        /* 글자가 튀어나오는 중앙 디스플레이 영역 */
        #stage {
            flex-grow: 1;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* 튀어나오는 글자 스타일 */
        .spawned-char {
            position: absolute;
            font-size: 32px;
            font-weight: bold;
            animation: popUp 1.5s forwards ease-out;
            pointer-events: none;
        }
        .vowel { color: #4facfe; } /* 여와 쪽 모음 (푸른빛) */
        .consonant { color: #f857a6; } /* 복희 쪽 자음 (붉은빛) */

        @keyframes popUp {
            0% {
                transform: scale(0.3) translateY(0);
                opacity: 1;
            }
            100% {
                transform: scale(1.5) translateY(-120px);
                opacity: 0;
            }
        }

        /* 하단 조작 패널 (여와 vs 복희) */
        .control-panel {
            display: flex;
            width: 100%;
            height: 160px;
            background: #1e1e1e;
            border-top: 2px solid #333;
        }
        .side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .side.yeowha { border-right: 1px solid #333; background: #1a2530; }
        .side.bokhee { background: #301a1a; }
        
        .side:active {
            opacity: 0.7;
        }
        .side h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .action-btn {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }
        .yeowha-btn { background: #2980b9; }
        .bokhee-btn { background: #c0392b; }
    </style>
</head>
<body>

    <header>음(여와)과 양(복희)의 소리 창조</header>

    <!-- 글자가 튀어나오는 무대 -->
    <div id="stage">
        <div style="text-align: center; color: #666; font-size: 14px;">
            아래 여와(모음) 또는 복희(자음) 버튼을 눌러보세요
        </div>
    </div>

    <!-- 조작 패널 -->
    <div class="control-panel">
        <!-- 여와 영역 (모음) -->
        <div class="side yeowha">
            <h3 style="color: #4facfe;">여와 (입: 모음)</h3>
            <div class="btn-group">
                <button class="action-btn yeowha-btn" onclick="spawnChar('ㅣ', 'vowel', event)">ㅣ</button>
                <button class="action-btn yeowha-btn" onclick="spawnChar('ㅡ', 'vowel', event)">ㅡ</button>
                <button class="action-btn yeowha-btn" onclick="spawnChar('아', 'vowel', event)">아</button>
                <button class="action-btn yeowha-btn" onclick="spawnChar('어', 'vowel', event)">어</button>
                <button class="action-btn yeowha-btn" onclick="spawnChar('오', 'vowel', event)">오</button>
                <button class="action-btn yeowha-btn" onclick="spawnChar('우', 'vowel', event)">우</button>
            </div>
        </div>

        <!-- 복희 영역 (자음) -->
        <div class="side bokhee">
            <h3 style="color: #e74c3c;">복희 (입: 자음)</h3>
            <div class="btn-group">
                <button class="action-btn bokhee-btn" onclick="spawnChar('가다', 'consonant', event)">가다</button>
                <button class="action-btn bokhee-btn" onclick="spawnChar('들어오다', 'consonant', event)">들어오다</button>
                <button class="action-dfn bokhee-btn" onclick="spawnChar('트다', 'consonant', event)" style="background:#c0392b;">트다</button>
                <button class="action-btn bokhee-btn" onclick="spawnChar('넣다', 'consonant', event)">넣다</button>
                <button class="action-btn bokhee-btn" onclick="spawnChar('뿌리다', 'consonant', event)">뿌리다</button>
                <button class="action-btn bokhee-btn" onclick="spawnChar('구르다', 'consonant', event)">구르다</button>
                <button class="action-btn bokhee-btn" onclick="spawnChar('꼬다', 'consonant', event)">꼬다</button>
                <button class="action-btn bokhee-btn" onclick="spawnChar('펴다', 'consonant', event)">펴다</button>
            </div>
        </div>
    </div>

    <script>
        function spawnChar(text, type, event) {
            const stage = document.getElementById('stage');
            
            // 안내 문구 제거
            const guide = stage.querySelector('div');
            if (guide) guide.remove();

            const el = document.createElement('div');
            el.className = `spawned-char ${type}`;
            el.innerText = text;

            // 터치/클릭한 위치 근처에서 위로 튀어나오도록 설정
            const x = event.clientX || (event.touches ? event.touches[0].clientX : window.innerWidth / 2);
            el.style.left = (x - 20) + 'px';
            el.style.bottom = '40px';

            stage.appendChild(el);

            // 애니메이션이 끝나면 DOM에서 삭제
            setTimeout(() => {
                el.remove();
            }, 1500);
        }
    </script>

</body>
</html>
