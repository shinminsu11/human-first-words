<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복희 여와 음악 2곡</title>

    <style>
        /* ===================================================
           💡 [크기 조절 설정 가이드]
           1. 이미지 크기: 아래 img의 width 값을 원하는 픽셀(px)로 바꾸세요. (예: 500px, 700px 등)
           2. 전체 창 크기: body의 max-width 값을 변경하세요. (기본: 600px)
           3. 가사창 높이: .lyrics-container의 max-height 값을 변경하세요. (기본: 400px)
           4. 가사 글자 크기: .lyrics-container의 font-size 값을 변경하세요. (기본: 1.1rem)
        =================================================== */

        body {
            background-color: #121214;
            color: #e4e4e7;
            font-family: 'Malgun Gothic', sans-serif;
            max-width: 600px; /* 👈 [전체 창 크기] 화면 최대 너비 조절 */
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        .image-container {
            margin: 20px auto;
            background: #1a1a1e;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;             /* 👈 이미지를 항상 중앙에 오게 하는 핵심 설정 */
            justify-content: center;   /* 👈 가로 중앙 정렬 */
            align-items: center;       /* 👈 세로 중앙 정렬 */
            width: 100%;               /* 👈 부모 박스 너비를 꽉 채우게 설정 */
            box-sizing: border-box;
        }

        img {
            width: 750px;       /* 👈 [이미지 크기] 이 숫자를 키우거나 줄여서 이미지만 조절하세요! */
            max-width: 100%;    /* 👈 화면이 작아지면 자동으로 줄어들어 깨짐 방지 */
            height: auto;       /* 👈 비율 유지 */
            border-radius: 8px;
            display: block;
            margin: 0 auto;     /* 👈 이미지 자체의 좌우 여백을 균등하게 주어 중앙 정렬 보조 */
        }

        h1 {
            font-size: 1.8rem;
            margin: 30px 0 20px 0;
            color: #ffffff;
        }

        .playlist {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .track-btn {
            flex: 1;
            background-color: #26262b;
            color: #a1a1aa;
            border: none;
            padding: 18px 10px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            text-align: center;
        }

        .track-btn.active {
            background-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .now-playing {
            background-color: #1a1a1e;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            color: #a1a1aa;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .now-playing span {
            color: #fbbf24;
            font-weight: bold;
        }

        audio {
            width: 100%;
            border-radius: 30px;
            background: #ffffff;
            margin-bottom: 30px;
        }

        .lyrics-container {
            background-color: #1a1a1e;
            padding: 25px;
            border-radius: 16px;
            text-align: left;
            white-space: pre-wrap;
            font-size: 2.1rem;   /* 👈 [가사 글자 크기] 가사 폰트 크기 조절 */
            line-height: 1.7;
            color: #d4d4d8;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
            max-height: 400px;   /* 👈 [가사창 높이] 가사창의 세로 최대 높이 조절 (스크롤 생성) */
            overflow-y: auto;    /* 👈 가사가 길면 스크롤이 생기도록 설정 */
        }
    </style>
</head>

<body>

    <div class="image-container">
        <img src="fuxi.png" alt="복희 여와 타이틀 그림">
    </div>

    <h1>복희 여와 음악 2곡</h1>

    <!-- 곡 선택 버튼 -->
    <div class="playlist">
        <button class="track-btn active"
                id="btn-1"
                onclick="selectTrack(1)">
            🎵일 구부려 꺾어
        </button>

        <button class="track-btn"
                id="btn-2"
                onclick="selectTrack(2)">
            🎵복희 여와 한글을 노래하다
        </button>
    </div>

    <!-- 현재 재생 중 -->
    <div class="now-playing">
        현재 재생 중 :
        <span id="current-title">일 구부려 꺾어 </span>
    </div>

    <!-- 오디오 -->
    <audio id="audio-player" controls>
        <source id="audio-source"
                src="fuxi1.mp3"
                type="audio/mpeg">

        브라우저가 오디오 태그를 지원하지 않습니다.
    </audio>

    <!-- 가사 -->
    <div class="lyrics-container" id="lyrics-display">
        (Intro)
        일 꾸부려 꺾어 일 꾸부려 꺾어
        일 꾸부려 꺾어
        우주의 형상은 일 구부러짐과 꺾임으로 이루어졌다
        여와의 컴퍼스는 곡선 복희의 직각자는 꺾임이라
    </div>

<script>
    const track1 = {
        title: "일 구부려 꺽어",
        src: "fuxi1.mp3",
        lyrics: `(Intro)
일 꾸부려 꺾어 일 꾸부려 꺾어
일 꾸부려 꺾어
우주의 형상은 일 구부러짐과 꺾임으로 이루어졌다
여와의 컴퍼스는 곡선 복희의 직각자는 꺾임이라

(Verse 1)
좌우의 대칭 홀짝 짝꿍
왼쪽엔 여와 음태극, 
오른쪽 복희 양태극...`
    };

    const track2 = {
        title: "복희 여와 한글을 노래하다",
        src: "fuxi.mp3",
        lyrics: `(Intro)
일 꾸부려 꺾어 일 꾸부려 꺾어
일 꾸부려 꺾어
우주의 형상은 일 구부러짐과 꺾임으로 이루어졌다
여와의 컴퍼스는 곡선 복희의 직각자는 꺾임이라...`
    };

    let currentTrack = 1;

    function selectTrack(trackNum) {
        const btn1 = document.getElementById('btn-1');
        const btn2 = document.getElementById('btn-2');
        const currentTitle = document.getElementById('current-title');
        const audioSource = document.getElementById('audio-source');
        const audioPlayer = document.getElementById('audio-player');
        const lyricsDisplay = document.getElementById('lyrics-display');

        currentTrack = trackNum;

        if (trackNum === 1) {
            btn1.classList.add('active');
            btn2.classList.remove('active');
            currentTitle.innerText = track1.title;
            audioSource.src = track1.src;
            lyricsDisplay.innerText = track1.lyrics;
        } else {
            btn2.classList.add('active');
            btn1.classList.remove('active');
            currentTitle.innerText = track2.title;
            audioSource.src = track2.src;
            lyricsDisplay.innerText = track2.lyrics;
        }

        audioPlayer.load();
        audioPlayer.play().catch(function() {});
    }

    const audioPlayer = document.getElementById('audio-player');
    audioPlayer.addEventListener('ended', function() {
        if (currentTrack === 1) {
            selectTrack(2);
        } else {
            selectTrack(1);
        }
    });
</script>

</body>
</html>
