<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>태극 플레이어</title>

<style>
body {
  background: black;
  color: white;
  text-align: center;
  font-family: sans-serif;
}

button {
  padding: 10px 20px;
  margin: 10px;
  font-size: 16px;
}

.active {
  background: blue;
  color: white;
}

#lyricsBox {
  margin-top: 20px;
  white-space: pre-line;
  display: none;
}
</style>
</head>

<body>

<h1>🎵 태극 플레이어</h1>

<button onclick="playMusic('taegeuk.mp3', this, 0)">태극문 열려라</button>
<button onclick="playMusic('taegeuk1.mp3', this, 1)">태극이 돌아간다</button>

<br>

<button onclick="toggleLyrics()">가사 보기</button>

<p id="now">현재 재생: 없음</p>

<audio id="player" controls></audio>

<div id="lyricsBox"></div>

<script>
// 🔥 가사 직접 넣는 곳
const lyrics = [
`[Intro]

태극문 열려라

[Verse 1]

오른쪽 오른다 Right 양
왼쪽 내린다 Left 음

태극이 돌아간다

카라 하나 간다
뜨르 둘 들어온다


트르서 셋 터진다 솟는다
너르서 넷 넣다 내려간다


트르서서 다섯 뿌르 뿌려라
너르서서 여섯 모르 몰려라


일곱 꾸르 꾸부려 꺾어라
여덟 피르 펴라 펼쳐라


아홉 리을 태극엔진 돌아라 돌아라
여르 열 열려라


[Verse 2]
오른쪽 오른다 Right 양
왼쪽 내린다 Left 음

태극이 돌아간다

하나 둘 앞뒤축 선
셋 넷 동서축 면
다섯 여섯 남북축 입체

앞뒤동서남북 세축
삼합육생 팽창의 끝 더 이상 갈 곳이 없다 꺾어라 
일 구부려 꺾어 일 구부려 꺾어 꺾어라 
일곱 큐브 큐브 큐브
여덟 팔괘 펼쳐라 펼쳐라 

아홉 태극엔진 돌아라 

열 여르 열려라

[Drop / Hook]


태극이 돌아간다
태극이 돌아간다

오른쪽 오른다 Right 양
왼쪽 내려간다 Left 음

오른손과 왼손이 만난다
열 완성


돌고 돈다
태극이 돈다

태극이 열린다

열 여르 열려라
열 여르 열려라

[Final Message 🌍]

손과 손이 만난다  

사람과 사람이 만난다  
세계가 하나로 모인다  

모든 방향이  
하나로 모인다  

짝  

---

[Outro]

태극이 돌아간다  

오른쪽은 오른다  
왼쪽은 내린다  

카라는 간다  
뜨르는 들어온다  

오른손 왼손
손바닥이 합쳐진다  

열 

완성  

짝…`,
`여기에 태극이 돌아간다 가사 넣기`
];

let currentIndex = -1;

function playMusic(file, btn, index) {
  const player = document.getElementById("player");
  const now = document.getElementById("now");

  player.src = file;
  player.play();

  currentIndex = index;

  // 버튼 색 변경
  document.querySelectorAll("button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  now.innerText = "현재 재생: " + file;

  // 가사 초기화
  document.getElementById("lyricsBox").style.display = "none";
}

function toggleLyrics() {
  const box = document.getElementById("lyricsBox");

  if (currentIndex === -1) {
    alert("먼저 곡을 재생하세요");
    return;
  }

  if (box.style.display === "none") {
    box.style.display = "block";
    box.innerText = lyrics[currentIndex];
  } else {
    box.style.display = "none";
  }
}
</script>

</body>
</html>
