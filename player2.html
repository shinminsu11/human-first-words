<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>태극 음악 노래방</title>

<style>
body {
    margin: 0;
    padding: 20px 0;
    background: radial-gradient(circle at center, #050508, #000000);
    color: #f1f5f9;
    font-family: 'Malgun Gothic', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

/* 🌌 별 배경 */
body::before {
    content: "";
    position: fixed;
    width: 200%;
    height: 200%;
    background: url('https://www.transparenttextures.com/patterns/stardust.png');
    animation: moveStars 60s linear infinite;
    opacity: 0.3;
}

@keyframes moveStars {
    from { transform: translate(0,0); }
    to { transform: translate(-500px,-500px); }
}

.container {
    width: 90%;
    max-width: 650px;
    background: linear-gradient(145deg, #121520, #090a10);
    border-radius: 30px;
    padding: 30px 25px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    border: 1px solid #1f283d;
    text-align: center;
    position: relative;
    z-index: 1;
}

/* 🌀 이미지 효과 */
.artwork {
    width: 100%;
    max-height: 320px;
    object-fit: contain;
    border-radius: 16px;
    margin-bottom: 20px;
    border: 1px solid #2a3654;
    animation: float 6s ease-in-out infinite;
    box-shadow: 0 0 30px rgba(255,200,100,0.2);
}

@keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
}

h1 {
    font-size: 26px;
    margin-bottom: 15px;
}

.song-selector {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
}

.song-btn {
    flex: 1;
    background-color: #1a2030;
    color: #8a9bb8;
    border: 1px solid #2d3b59;
    padding: 14px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}
