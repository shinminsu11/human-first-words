<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>태극 플레이어</title>

<style>
body {
  background: linear-gradient(180deg, #000000, #111);
  color: white;
  text-align: center;
  font-family: 'Segoe UI', sans-serif;
}

/* 제목 */
h1 {
  margin-top: 30px;
  font-size: 28px;
}

/* 버튼 공통 */
button {
  padding: 14px 24px;
  margin: 10px;
  font-size: 16px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  background: #222;
  color: white;
  transition: 0.2s;
}

/* 호버 효과 */
button:hover {
  transform: scale(1.05);
  background: #333;
}

/* 현재 선택 */
.active {
  background: linear-gradient(45deg, #0066ff, #00ccff);
  box-shadow: 0 0 10px #00ccff;
}

/* 가사 버튼 */
#lyricsBtn {
  background: #444;
}

/* 현재 재생 텍스트 */
#now {
  margin-top: 15px;
  font-size: 14px;
  color: #aaa;
}

/* 오디오 플레이어 */
audio {
  margin-top: 20px;
  width: 80%;
  max-width: 400px;
}

/* 가사 박스 */
#lyricsBox {
  margin: 20px;
  padding: 15px;
  border-radius: 10px;
  background: #111;
  color: #ddd;
  display: none;
  white-space: pre-line;
  line-height: 1.5;
}
</style>
</head>

<body>

<h1>🎧 태극 플레이어</h1>

<button onclick="playMusic('taegeuk.mp3', this, 0)">태극문 열려라</button>
<button onclick="playMusic('taegeuk1.mp3', this, 1)">태극이 돌아간다</button>

<br>

<button id="lyricsBtn" onclick="toggleLyrics()">📜 가사 보기</button>

<p id="now">현재 재생: 없음</p>

<audio id="player" controls></audio>

<div id="lyricsBox"></div>

<script>
const lyrics = [
`여기에 태극문 열려라 가사`,
`여기에 태극이 돌아간다 가사`
];

let currentIndex = -1;

function playMusic(file, btn, index) {
  const player = document.getElementById("player");
  const now = document.getElementById("now");

  player.src = file;
  player.play();

  currentIndex = index;

  document.querySelectorAll("button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  now.innerText = "현재 재생: " + file;

  document.getElementById("lyricsBox").style.display = "none";
}

function toggleLyrics() {
  const box = document.getElementById("lyricsBox");

  if (currentIndex === -1) {
    alert("먼저 곡을 선택하세요");
    return;
  }

  if (box.style.display === "none") {
    box.style.display = "block";
    box.innerText = lyrics[currentIndex];
  } else {
    box.style.display = "none";
  }
}
</script>

</body>
</html>
